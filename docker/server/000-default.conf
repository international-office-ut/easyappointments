<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The storage and writable trees sit outside the web root on purpose;
    # deny direct access in depth, even if the docroot gets reconfigured.
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>
    <Directory /var/www/html/writable>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
