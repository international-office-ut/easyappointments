<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The storage and writable trees sit outside the web root on purpose;
    # deny direct access in depth, even if the docroot gets reconfigured.
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>
    <Directory /var/www/html/writable>
        Require all denied
    </Directory>

    # Header parity with the prod vhost (which carries its own header block).
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
