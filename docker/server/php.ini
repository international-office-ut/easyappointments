date.timezone = UTC
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 0

; Xdebug 3 keys (the old xdebug.remote_* settings are Xdebug 2 only).
; The debugger starts on request (XDEBUG_TRIGGER) so that CLI steps like
; `spark` do not keep trying to reach the dev machine.
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.discover_client_host = 0
